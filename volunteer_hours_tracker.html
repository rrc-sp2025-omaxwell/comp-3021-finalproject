<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css" />
        <title>Template</title>
    </head>    
    <body>
        <header>
            <h1 class="inter-header">PiXELL River Financial</h1>
        </header>
        
        <div id="navbar">

        </div>

        <section id="volunteer_hours_tracker" class="section">
            <h2 id="section_header" class="inter-header">Volunteer Hours</h2>
            <form id="volunteer_form">
                <div class="form_input">
                    <label for="charity_name" class="inter-general">Charity:</label>
                    <input type="text" id="charity_name" name="charity_name"/>
                    <span id="charity_name_error" class="error-message" aria-live="polite"></span>
                </div>
                <div class="form_input">
                    <label for="hours_volunteered" class="inter-general">Hours Volunteered:</label>
                    <input type="number" id="hours_volunteered" name="hours_volunteered" 
                    max="24"/>
                    <span id="hours_volunteered_error" class="error-message" aria-live="polite"></span>
                </div>
                <div class="form_input">
                    <label for="date_volunteered" class="inter-general">Date Volunteered:</label>
                    <input type="date" id="date_volunteered" name="date_volunteered" />
                    <span id="date_volunteered_error" class="error-message" aria-live="polite"></span>
                </div>
                <div class="form_input">
                    <label for="volunteer_experience_rating" class="inter-general">Volunteer Experience Rating:</label>
                    <input type="number" id="volunteer_experience_rating" 
                    name="volunteer_experience_rating" max="5"/>
                    <span id="volunteer_experience_rating_error" class="error-message" aria-live="polite"></span>
                </div>

                <input type="submit" value="Submit" class="inter-general" id="submit_button"/>
            </form>
        </section>

        <section id="volunteerDataTable" class="section volunteerTableHidden">

            <h2>Volunteer History</h2>

            <div id="volunteerSummary">
                <h3>Summary:</h3>
                <p id="totalVolunteeringHours"></p>
            </div>

            <table id="volunteerTable">

            </table>

        </section>

        <footer>
            <h4 class="inter-header">Website Developed By:</h4>
            <p class="inter-general">Divya Divya, Jasmine Sunga, Owen Maxwell</p>
        </footer>
    </body>
    <script src="script.js"></script>
</html>
